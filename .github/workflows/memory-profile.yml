name: Memory profile

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  profile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install ATD system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;aosp_atd;x86_64" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n atd -k "system-images;android-30;aosp_atd;x86_64" -d pixel_5

      - name: Run profile on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: atd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          # The runner executes each line as its own sh, so shell state must
          # stay inside a single line. Bypasses AGP's connected-test device
          # filter; gradle only assembles the two APKs.
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk; adb shell getprop ro.product.cpu.abi; adb shell getprop sys.boot_completed
            for i in $(seq 1 60); do adb shell cmd package list packages >/dev/null 2>&1 && break; sleep 2; done
            ./gradlew assembleDebug assembleDebugAndroidTest > build.log 2>&1; gradle_status=$?; tail -3 build.log; APP_APK=$(find app/build/outputs/apk/debug -name 'app-x86_64-debug.apk' | head -1); TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest*.apk' | head -1); adb install -r "$APP_APK" || gradle_status=1; adb install -r "$TEST_APK" || gradle_status=1; out=$(adb shell am instrument -w io.ahxxm.ic.test/androidx.test.runner.AndroidJUnitRunner); echo "$out" > instrument.txt; echo "$out" | tail -15; case "$out" in *"OK (1 test)"*) ;; *) gradle_status=1;; esac; adb logcat -d > logcat.txt; adb exec-out run-as io.ahxxm.ic cat files/memory-profile.md > memory-profile.md; exit $gradle_status

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidtest-evidence
          path: |
            logcat.txt
            instrument.txt
          if-no-files-found: ignore

      - name: Publish report
        if: always()
        run: |
          [ -f memory-profile.md ] && cat memory-profile.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: memory-profile
          path: memory-profile.md
          if-no-files-found: ignore
