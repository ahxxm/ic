name: Memory profile

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  profile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install ATD system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;aosp_atd;x86_64" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n atd -k "system-images;android-30;aosp_atd;x86_64" -d pixel_5

      - name: Run profile on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          avd-name: atd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Pull report
        run: |
          adb exec-out run-as io.ahxxm.ic cat files/memory-profile.md > memory-profile.md
          cat memory-profile.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: memory-profile
          path: memory-profile.md
          if-no-files-found: error
